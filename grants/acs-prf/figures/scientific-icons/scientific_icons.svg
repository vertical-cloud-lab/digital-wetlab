<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .icon-label { font-size: 11px; fill: #333; text-anchor: middle; }
    .icon-sublabel { font-size: 9px; fill: #777; text-anchor: middle; }
  </style>
  
  <text x="250" y="25" text-anchor="middle" style="font-size: 16px; fill: #222; font-weight: bold;">Scientific Icons — Proposal Figure Components</text>
  
  <!-- Row 1: Lab equipment -->
  <!-- Beaker -->
  <g transform="translate(60,60)">
    <rect x="10" y="15" width="50" height="45" rx="3" fill="none" stroke="#2196F3" stroke-width="2.5"/>
    <rect x="10" y="35" width="50" height="25" rx="3" fill="#BBDEFB" stroke="none"/>
    <line x1="5" y1="15" x2="65" y2="15" stroke="#2196F3" stroke-width="2.5"/>
    <text x="35" y="82" class="icon-label">Beaker</text>
    <text x="35" y="94" class="icon-sublabel">Stock solutions</text>
  </g>
  
  <!-- Test tube -->
  <g transform="translate(170,60)">
    <rect x="20" y="5" width="20" height="45" rx="2" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <path d="M20,50 Q30,65 40,50" fill="none" stroke="#4CAF50" stroke-width="2"/>
    <rect x="20" y="25" width="20" height="20" rx="1" fill="#C8E6C9" stroke="none"/>
    <line x1="15" y1="5" x2="45" y2="5" stroke="#4CAF50" stroke-width="2"/>
    <text x="30" y="82" class="icon-label">Test Tube</text>
    <text x="30" y="94" class="icon-sublabel">Samples</text>
  </g>
  
  <!-- 96-well plate (top view) -->
  <g transform="translate(280,60)">
    <rect x="5" y="10" width="60" height="45" rx="3" fill="none" stroke="#FF9800" stroke-width="2"/>
    <!-- Mini wells -->
    <g fill="none" stroke="#FF9800" stroke-width="0.8">
      <circle cx="15" cy="20" r="3"/><circle cx="25" cy="20" r="3"/><circle cx="35" cy="20" r="3"/>
      <circle cx="45" cy="20" r="3"/><circle cx="55" cy="20" r="3"/>
      <circle cx="15" cy="30" r="3"/><circle cx="25" cy="30" r="3"/><circle cx="35" cy="30" r="3"/>
      <circle cx="45" cy="30" r="3"/><circle cx="55" cy="30" r="3"/>
      <circle cx="15" cy="40" r="3"/><circle cx="25" cy="40" r="3"/><circle cx="35" cy="40" r="3"/>
      <circle cx="45" cy="40" r="3"/><circle cx="55" cy="40" r="3"/>
      <circle cx="15" cy="50" r="3"/><circle cx="25" cy="50" r="3"/><circle cx="35" cy="50" r="3"/>
      <circle cx="45" cy="50" r="3"/><circle cx="55" cy="50" r="3"/>
    </g>
    <text x="35" y="82" class="icon-label">96-Well Plate</text>
    <text x="35" y="94" class="icon-sublabel">Screening format</text>
  </g>
  
  <!-- Pipette -->
  <g transform="translate(390,60)">
    <rect x="25" y="5" width="12" height="35" rx="4" fill="none" stroke="#9C27B0" stroke-width="2"/>
    <line x1="31" y1="40" x2="31" y2="55" stroke="#9C27B0" stroke-width="2"/>
    <polygon points="28,55 31,65 34,55" fill="#9C27B0"/>
    <circle cx="31" cy="15" r="5" fill="none" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="31" y="82" class="icon-label">Pipette</text>
    <text x="31" y="94" class="icon-sublabel">Sample preparation</text>
  </g>
  
  <!-- Row 2: Instruments -->
  <!-- Robot arm -->
  <g transform="translate(60,180)">
    <rect x="15" y="30" width="40" height="30" rx="3" fill="none" stroke="#607D8B" stroke-width="2"/>
    <line x1="35" y1="30" x2="45" y2="10" stroke="#607D8B" stroke-width="3"/>
    <line x1="45" y1="10" x2="55" y2="25" stroke="#607D8B" stroke-width="2"/>
    <circle cx="45" cy="10" r="3" fill="#607D8B"/>
    <circle cx="55" cy="25" r="2" fill="#607D8B"/>
    <text x="35" y="82" class="icon-label">OT-2 Robot</text>
    <text x="35" y="94" class="icon-sublabel">Automation</text>
  </g>
  
  <!-- Thermometer -->
  <g transform="translate(170,180)">
    <rect x="27" y="5" width="8" height="40" rx="3" fill="none" stroke="#F44336" stroke-width="2"/>
    <circle cx="31" cy="50" r="8" fill="none" stroke="#F44336" stroke-width="2"/>
    <rect x="29" y="25" width="4" height="20" fill="#F44336" rx="1"/>
    <circle cx="31" cy="50" r="5" fill="#F44336"/>
    <text x="31" y="82" class="icon-label">Temperature</text>
    <text x="31" y="94" class="icon-sublabel">25–90 °C range</text>
  </g>
  
  <!-- pH meter -->
  <g transform="translate(280,180)">
    <rect x="15" y="15" width="35" height="25" rx="3" fill="none" stroke="#00BCD4" stroke-width="2"/>
    <text x="32" y="33" style="font-size: 10px; fill: #00BCD4; font-weight: bold;">pH</text>
    <line x1="32" y1="40" x2="32" y2="60" stroke="#00BCD4" stroke-width="2"/>
    <ellipse cx="32" cy="62" rx="4" ry="6" fill="none" stroke="#00BCD4" stroke-width="1.5"/>
    <text x="32" y="82" class="icon-label">pH Control</text>
    <text x="32" y="94" class="icon-sublabel">pH 4–9 range</text>
  </g>
  
  <!-- Microscope -->
  <g transform="translate(390,180)">
    <rect x="20" y="50" width="30" height="8" rx="2" fill="none" stroke="#795548" stroke-width="2"/>
    <line x1="35" y1="50" x2="35" y2="25" stroke="#795548" stroke-width="3"/>
    <line x1="35" y1="25" x2="25" y2="35" stroke="#795548" stroke-width="2"/>
    <circle cx="25" cy="38" r="5" fill="none" stroke="#795548" stroke-width="1.5"/>
    <text x="32" y="82" class="icon-label">Microscopy</text>
    <text x="32" y="94" class="icon-sublabel">SEM imaging</text>
  </g>

  <!-- Row 3: Data/Analysis -->
  <!-- Chart -->
  <g transform="translate(60,300)">
    <rect x="10" y="10" width="50" height="45" rx="2" fill="none" stroke="#E91E63" stroke-width="2"/>
    <polyline points="15,48 25,35 35,40 45,20 55,25" fill="none" stroke="#E91E63" stroke-width="2"/>
    <line x1="15" y1="50" x2="55" y2="50" stroke="#E91E63" stroke-width="1"/>
    <line x1="15" y1="15" x2="15" y2="50" stroke="#E91E63" stroke-width="1"/>
    <text x="35" y="82" class="icon-label">Data Analysis</text>
    <text x="35" y="94" class="icon-sublabel">SI computation</text>
  </g>
  
  <!-- Database -->
  <g transform="translate(170,300)">
    <ellipse cx="30" cy="18" rx="22" ry="8" fill="none" stroke="#3F51B5" stroke-width="2"/>
    <path d="M8,18 v25 a22,8 0 0,0 44,0 v-25" fill="none" stroke="#3F51B5" stroke-width="2"/>
    <ellipse cx="30" cy="30" rx="22" ry="8" fill="none" stroke="#3F51B5" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="30" y="82" class="icon-label">Database</text>
    <text x="30" y="94" class="icon-sublabel">Pitzer parameters</text>
  </g>
  
  <!-- Oil derrick -->
  <g transform="translate(280,300)">
    <polygon points="30,10 15,55 45,55" fill="none" stroke="#795548" stroke-width="2"/>
    <line x1="30" y1="10" x2="30" y2="55" stroke="#795548" stroke-width="1.5"/>
    <line x1="20" y1="30" x2="40" y2="30" stroke="#795548" stroke-width="1.5"/>
    <line x1="17" y1="42" x2="43" y2="42" stroke="#795548" stroke-width="1.5"/>
    <rect x="10" y="55" width="40" height="5" fill="#795548" rx="1"/>
    <text x="30" y="82" class="icon-label">Petroleum</text>
    <text x="30" y="94" class="icon-sublabel">Industry relevance</text>
  </g>
  
  <!-- Publication -->
  <g transform="translate(390,300)">
    <rect x="15" y="10" width="35" height="45" rx="2" fill="none" stroke="#009688" stroke-width="2"/>
    <line x1="22" y1="20" x2="43" y2="20" stroke="#009688" stroke-width="1.5"/>
    <line x1="22" y1="27" x2="43" y2="27" stroke="#009688" stroke-width="1.5"/>
    <line x1="22" y1="34" x2="43" y2="34" stroke="#009688" stroke-width="1.5"/>
    <line x1="22" y1="41" x2="35" y2="41" stroke="#009688" stroke-width="1.5"/>
    <text x="32" y="82" class="icon-label">Publication</text>
    <text x="32" y="94" class="icon-sublabel">Peer-reviewed data</text>
  </g>

  <!-- Row 4: Minerals / Crystals -->
  <!-- FeS crystal -->
  <g transform="translate(120,420)">
    <polygon points="30,5 50,15 45,40 15,40 10,15" fill="#333" fill-opacity="0.3" stroke="#333" stroke-width="1.5"/>
    <polygon points="30,5 50,15 55,10 35,0" fill="#555" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
    <text x="30" y="60" class="icon-label">FeS Mackinawite</text>
    <text x="30" y="72" class="icon-sublabel">Iron sulfide crystal</text>
  </g>
  
  <!-- PbS crystal (cubic) -->
  <g transform="translate(280,420)">
    <rect x="12" y="12" width="30" height="30" fill="#666" fill-opacity="0.3" stroke="#444" stroke-width="1.5"/>
    <polygon points="12,12 22,2 52,2 42,12" fill="#888" fill-opacity="0.2" stroke="#444" stroke-width="1"/>
    <polygon points="42,12 52,2 52,32 42,42" fill="#777" fill-opacity="0.2" stroke="#444" stroke-width="1"/>
    <text x="30" y="60" class="icon-label">PbS Galena</text>
    <text x="30" y="72" class="icon-sublabel">Lead sulfide crystal</text>
  </g>
</svg>
